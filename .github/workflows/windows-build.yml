name: Windows build and smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - 'feature/**'
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install GUI and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build one-file application
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1

      - name: Smoke-test packaged executable
        shell: pwsh
        run: .\dist\PointCloudMLStudio.exe --smoke-test

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PointCloudMLStudio-Windows
          path: dist/PointCloudMLStudio.exe
          if-no-files-found: error
